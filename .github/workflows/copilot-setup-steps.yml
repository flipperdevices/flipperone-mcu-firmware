name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/toolchain/**
      - toolchain.json
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/toolchain/**
      - toolchain.json

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history and tags: the configure derives the version from them
      - name: "Checkout code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: "Update submodules"
        run: |
          set -euo pipefail
          args=(--init --recursive --depth 1 --filter=blob:none --jobs="$(nproc)")
          attempt=0
          until timeout 600 git submodule update "${args[@]}"; do
            attempt=$((attempt + 1))
            if (( attempt >= 3 )); then
              echo "submodule update failed after ${attempt} attempts"
              exit 1
            fi
            echo "submodule update attempt ${attempt}/3 failed; retrying in $((attempt * 15))s"
            sleep "$((attempt * 15))"
          done

      # The pinned toolchain, so the agent can configure and build
      - name: "Set up toolchain"
        uses: ./.github/actions/toolchain
