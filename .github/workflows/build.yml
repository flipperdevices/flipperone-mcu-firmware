name: 'Build'

on:
  push:
    branches:
      - dev
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Declaring 'permissions' drops every unlisted scope to 'none', so list everything
# the workflow needs:
# - contents: write — 'softprops/action-gh-release' creates releases and uploads assets
# - issues/pull-requests: write — 'peter-evans/create-or-update-comment' posts the
#   firmware link comment on PRs (PR comments go through the issues API)
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  ARM_NONE_EABI_GCC_VERSION: 14.2.1-1.1
  PICO_SDK_VERSION: 2.2.0

jobs:
  firmware:
    runs-on: ubuntu-latest

    strategy:
      # One target failing to build says nothing about the others, so let them finish
      fail-fast: false
      matrix:
        # Every directory under targets/ that has a target.cmake.
        # Keep in sync with the links posted by the 'comment' job below.
        target: [f1, f2]

    # Identical across the matrix — the targets only differ in what they build
    outputs:
      branch_name: ${{ steps.names.outputs.branch_name }}
      commit_sha: ${{ steps.names.outputs.commit_sha }}
      suffix: ${{ steps.names.outputs.suffix }}

    steps:
    - name: Clean workspace
      run: |
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"

    - name: Restore cached toolchain and pico-sdk
      id: cache
      uses: actions/cache/restore@v5
      with:
        path: |
          arm-none-eabi-gcc
          pico-sdk
        key: gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }}-pico-sdk-${{ env.PICO_SDK_VERSION }}

    - name: Install cmake
      run: |
        sudo apt-get install cmake

    - name: Install ARM GCC {{ env.ARM_NONE_EABI_GCC_VERSION }}
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${{ env.ARM_NONE_EABI_GCC_VERSION }}/xpack-arm-none-eabi-gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }}-linux-x64.tar.gz
        tar -xzf xpack-arm-none-eabi-gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }}-linux-x64.tar.gz
        mv xpack-arm-none-eabi-gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }} arm-none-eabi-gcc

    - name: Add ARM GCC to PATH
      run: |
        export PATH=$PWD/arm-none-eabi-gcc/bin:$PATH
        echo "$PWD/arm-none-eabi-gcc/bin" >> $GITHUB_PATH
        arm-none-eabi-gcc --version

    - name: Checkout firmware
      uses: actions/checkout@v6
      with:
        path: firmware
        submodules: recursive
        fetch-depth: 2

    - name: 'Get commit details'
      id: names
      run: |
        if [[ ${{ github.event_name }} == 'pull_request' ]]; then
          TYPE="pull"
        elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
          TYPE="tag"
        else
          TYPE="other"
        fi
        python3 firmware/scripts/get_env.py "--event_file=${{ github.event_path }}" "--type=$TYPE"
        echo "event_type=$TYPE" >> $GITHUB_OUTPUT

    - name: Checkout pico-sdk/${{ env.PICO_SDK_VERSION }}
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/checkout@v6
      with:
        repository: raspberrypi/pico-sdk
        ref: ${{ env.PICO_SDK_VERSION }}
        path: pico-sdk

    - name: Checkout pico-sdk submodules
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/pico-sdk
      run: git submodule update --init

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      working-directory: ${{github.workspace}}/firmware
      run:  cmake -E make_directory ${{github.workspace}}/firmware/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{github.workspace}}/firmware/build
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: PICO_SDK_PATH=../../pico-sdk cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DFW_TARGET=${{ matrix.target }} -DCMAKE_EXE_LINKER_FLAGS="-Wl,-Map=${{github.workspace}}/firmware/build/flipperone-mcu-firmware.elf.map"

    - name: Get core count
      id: core_count
      run : cat /proc/cpuinfo  | grep processor | wc -l

    - name: Build
      working-directory: ${{github.workspace}}/firmware/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE --parallel $(nproc)

    # memmap_default.ld does `INCLUDE "pico_flash_region.ld"` (the FLASH region),
    # but that file is generated into the build dir. Co-locate both so MemBrowse
    # can resolve the include — passing them separately drops the FLASH region.
    - name: Collect linker script for MemBrowse
      if: matrix.target == 'f1'
      working-directory: ${{github.workspace}}/firmware/build
      run: |
        mkdir -p ldscripts
        cp ../../pico-sdk/src/rp2_common/pico_crt0/rp2350/memmap_default.ld ldscripts/
        cp "$(find . -name pico_flash_region.ld -print -quit)" ldscripts/

    # TODO: MemBrowse still tracks f1 only, under its original target name.
    # Reporting the other targets needs a separate MemBrowse-side target per board.
    - name: Run MemBrowse analysis
      if: matrix.target == 'f1'
      uses: membrowse/membrowse-action@v1
      env:
        GIT_DIR: ${{github.workspace}}/firmware/.git
        GIT_WORK_TREE: ${{github.workspace}}/firmware
      with:
        target_name: rp2350-flipperone
        elf: firmware/build/flipperone-mcu-firmware.elf
        ld: firmware/build/ldscripts/memmap_default.ld
        map_file: firmware/build/flipperone-mcu-firmware.elf.map
        api_key: ${{ secrets.MEMBROWSE_API_KEY }}
        api_url: ${{ vars.MEMBROWSE_API_URL }}

    - name: Save Cache
      id: cache-save
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          arm-none-eabi-gcc
          pico-sdk
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: 'Make artifacts directory'
      if: ${{ !github.event.pull_request.head.repo.fork }}
      run: |
        rm -rf artifacts
        mkdir artifacts

    - name: 'Move upload files'
      if: ${{ !github.event.pull_request.head.repo.fork }}
      run: |
        mv ${{github.workspace}}/firmware/build/flipperone-mcu-firmware.uf2 artifacts/flipper-one-mcu-${{ matrix.target }}-firmware-${SUFFIX}.uf2

    # Hand the .uf2 over to the jobs below, which need every target at once —
    # neither the update server nor the release can be fed from inside the matrix.
    - name: 'Stash artifacts for the jobs below'
      if: ${{ !github.event.pull_request.head.repo.fork }}
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.target }}
        path: artifacts/*.uf2
        if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: firmware
    if: ${{ !github.event.pull_request.head.repo.fork }}

    steps:
    - name: 'Collect artifacts from every target'
      uses: actions/download-artifact@v4
      with:
        pattern: firmware-*
        merge-multiple: true
        path: artifacts

    # The indexer wipes the destination directory on every request, so uploading
    # one target at a time would leave only whichever went up last. All of them
    # have to go in a single call.
    - name: 'Upload artifacts to update server'
      run: |
        FILES=$(for CUR in $(ls artifacts/); do echo "-F files=@artifacts/$CUR"; done)
        curl --fail -L -H "Token: ${{ secrets.INDEXER_TOKEN }}" \
            -F "branch=${{ needs.firmware.outputs.branch_name }}" \
            ${FILES[@]} \
            "${{ secrets.INDEXER_URL }}"/flipper-one-mcu/uploadfiles

  # Posting from inside the matrix would have every target fight over the same
  # comment, so the links for all of them are collected here instead.
  comment:
    runs-on: ubuntu-latest
    needs: [firmware, publish]
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.pull_request }}

    steps:
    - name: 'Find previous comment'
      uses: peter-evans/find-comment@v3
      id: find-comment
      with:
        issue-number: ${{ github.event.pull_request.number }}
        comment-author: 'github-actions[bot]'
        body-includes: 'Compiled firmware for commit'

    - name: 'Create or update comment'
      uses: peter-evans/create-or-update-comment@v4
      with:
        comment-id: ${{ steps.find-comment.outputs.comment-id }}
        issue-number: ${{ github.event.pull_request.number }}
        # One line per entry of the build matrix
        body: |
          **Compiled firmware for commit `${{needs.firmware.outputs.commit_sha}}`:**
          - [🍓 f1 UF2 file](https://update.flipperzero.one/builds/flipper-one-mcu/${{needs.firmware.outputs.branch_name}}/flipper-one-mcu-f1-firmware-${{needs.firmware.outputs.suffix}}.uf2)
          - [🍓 f2 UF2 file](https://update.flipperzero.one/builds/flipper-one-mcu/${{needs.firmware.outputs.branch_name}}/flipper-one-mcu-f2-firmware-${{needs.firmware.outputs.suffix}}.uf2)
        edit-mode: replace

  release:
    # Only on version-tag pushes (e.g. 1.4.3). Creates the release for the tag and
    # attaches the .uf2 of every target. action-gh-release uses the built-in
    # GITHUB_TOKEN by default, so no secret needs to be configured.
    runs-on: ubuntu-latest
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: 'Collect artifacts from every target'
      uses: actions/download-artifact@v4
      with:
        pattern: firmware-*
        merge-multiple: true
        path: artifacts

    - name: 'Create GitHub Release'
      uses: softprops/action-gh-release@v3
      with:
        files: artifacts/*.uf2
        generate_release_notes: true
        fail_on_unmatched_files: true

  # Branch protection requires a check named 'build'. A matrix job reports as
  # 'build (f1)', 'build (f2)' and so on — names that change every time a target
  # is added — so the required check is this fixed-name job instead.
  build:
    runs-on: ubuntu-latest
    needs: [firmware, publish]
    if: always()

    steps:
    # A job skipped because something it needed failed still counts as success
    # for a required check, so the results are inspected explicitly.
    - name: 'Check the jobs above'
      run: |
        echo "firmware: ${{ needs.firmware.result }}"
        echo "publish:  ${{ needs.publish.result }}"
        [ "${{ needs.firmware.result }}" = "success" ] || exit 1
        case "${{ needs.publish.result }}" in success|skipped) ;; *) exit 1 ;; esac
