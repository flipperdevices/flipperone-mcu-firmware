name: Onboard to MemBrowse

# Backfills historical memory data by rebuilding the last N commits and
# uploading a MemBrowse report for each. Run manually from the Actions tab.
#
# The onboard action checks out each commit in place and runs `git clean -fdx`
# before every build, so everything the build needs and that is not part of the
# repository lives outside the checkout: pico-sdk survives as a nested git repo,
# the rest goes to $RUNNER_TEMP.
on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '50'
        type: string

env:
  BUILD_TYPE: Release
  ARM_NONE_EABI_GCC_VERSION: 14.2.1-1.1
  # Also selects the prebuilt picotool, see build.yml
  PICO_SDK_VERSION: 2.3.1
  PICO_SDK_TOOLS_BUILD: 0

jobs:
  onboard:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with build.yml; one MemBrowse target per board
        target: [f1, f2]

    steps:
      - name: Install cmake and libusb
        run: sudo apt-get update && sudo apt-get install -y cmake libusb-1.0-0

      - name: Install ARM GCC ${{ env.ARM_NONE_EABI_GCC_VERSION }}
        run: |
          wget -q https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v${{ env.ARM_NONE_EABI_GCC_VERSION }}/xpack-arm-none-eabi-gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }}-linux-x64.tar.gz
          tar -xzf xpack-arm-none-eabi-gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }}-linux-x64.tar.gz
          mv xpack-arm-none-eabi-gcc-${{ env.ARM_NONE_EABI_GCC_VERSION }} "$HOME/arm-none-eabi-gcc"
          echo "$HOME/arm-none-eabi-gcc/bin" >> $GITHUB_PATH

      - name: Install picotool ${{ env.PICO_SDK_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          wget -q https://github.com/raspberrypi/pico-sdk-tools/releases/download/v${{ env.PICO_SDK_VERSION }}-${{ env.PICO_SDK_TOOLS_BUILD }}/picotool-${{ env.PICO_SDK_VERSION }}-x86_64-lin.tar.gz
          tar -xzf picotool-${{ env.PICO_SDK_VERSION }}-x86_64-lin.tar.gz picotool
          picotool/picotool version

      # Checked out at the workspace root so the onboard action can walk history.
      - name: Checkout firmware
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      # A nested git repo, which `git clean -fdx` leaves alone.
      - name: Checkout pico-sdk/${{ env.PICO_SDK_VERSION }}
        uses: actions/checkout@v6
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk

      - name: Checkout pico-sdk submodules
        working-directory: ${{ github.workspace }}/pico-sdk
        run: git submodule update --init

      # Taken from HEAD once: historical commits may not have the script at all.
      - name: Stash helper script outside the checkout
        run: cp scripts/membrowse_ldscripts.sh ${{ runner.temp }}/

      # The build fails on purpose for commits predating the target: the action
      # then uploads an empty report instead of attributing an f1 build to f2.
      # f1 is the implicit target of every commit before targets/<name>/ existed.
      - name: Run MemBrowse Onboard Action
        uses: membrowse/membrowse-action/onboard-action@v1
        with:
          target_name: flipper-one-mcu-${{ matrix.target }}
          num_commits: ${{ github.event.inputs.num_commits }}
          build_script: >
            ([ "${{ matrix.target }}" = f1 ] || test -f targets/${{ matrix.target }}/target.cmake) &&
            cmake -E make_directory build &&
            cd build &&
            PICO_SDK_PATH=${{ github.workspace }}/pico-sdk cmake .. -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DFW_TARGET=${{ matrix.target }} -Dpicotool_DIR=${{ runner.temp }}/picotool -DCMAKE_EXE_LINKER_FLAGS="-Wl,-Map=$PWD/flipperone-mcu-firmware.elf.map" &&
            cmake --build . --config $BUILD_TYPE --parallel $(nproc) &&
            ${{ runner.temp }}/membrowse_ldscripts.sh ${{ github.workspace }} $PWD ${{ github.workspace }}/pico-sdk
          elf: build/flipperone-mcu-firmware.elf
          ld: build/ldscripts/memmap_default.ld
          map_file: build/flipperone-mcu-firmware.elf.map
          # Same values as in build.yml, see the comment there
          linker_vars: >-
            RAM_ORIGIN=0x20000000 RAM_LENGTH=512k
            SCRATCH_X_ORIGIN=0x20080000 SCRATCH_X_LENGTH=4k
            SCRATCH_Y_ORIGIN=0x20081000 SCRATCH_Y_LENGTH=4k
            XIP_RAM_ORIGIN=0x13FFC000 XIP_RAM_LENGTH=16k
          binary_search: 'true'
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
