name: MemBrowse PR Comment

# The report + tokenless upload runs inside the "Build" workflow (build.yml).
# This separate workflow runs in the base-repo context so it can post the
# memory-usage comment on PRs from forks, which don't have access to secrets.
on:
  workflow_run:
    workflows: [Build]
    types:
      - completed

jobs:
  comment:
    runs-on: ubuntu-latest
    # Run even if some builds failed — only skip if the run was cancelled
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Post combined PR comment
        if: ${{ env.MEMBROWSE_API_KEY != '' }}
        uses: membrowse/membrowse-action/comment-action@v1
        with:
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          commit: ${{ github.event.workflow_run.head_sha }}
        env:
          MEMBROWSE_API_KEY: ${{ secrets.MEMBROWSE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
