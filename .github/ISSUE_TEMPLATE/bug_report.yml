name: Bug report
description: Report an MCU firmware, build or bootloader failure.
title: "[MCU] "
type: Bug
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions and configuration
      description: >-
        Fill in the tested versions. Add other involved versions, connections
        or build details when relevant.
      value: |
        MCU firmware / commit:
        Board revision:
    validations:
      required: true

  - type: dropdown
    id: runtime_mode
    attributes:
      label: MCU mode
      options:
        - With Linux
        - Standalone (MCU only)
        - Not applicable (build failure)
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include starting conditions and exact actions or commands.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Describe the failure. Add its impact or a workaround if known.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Frequency
      description: How often have you observed the failure?
      options:
        - Not checked
        - Observed once
        - Sometimes
        - Every attempt
      default: 0
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Evidence and links
      description: >-
        Attach logs, screenshots or recordings. Add links to the specific
        TestOps execution and related issues.
    validations:
      required: false
