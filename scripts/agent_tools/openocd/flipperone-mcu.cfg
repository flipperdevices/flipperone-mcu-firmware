# Flipper One MCU: the Pico SDK RP2350 target plus the board-specific helpers the
# tools need. Pass this file to `-f` instead of `target/rp2350.cfg`; it sources
# the SDK config, so every plain OpenOCD command keeps working.
#
# Everything that is board or core knowledge lives here, in one place: the core
# target names, how to halt and resume them, and the reboot vector that boots a
# try-before-you-buy image. The tools call the procs below and never name a
# target or a watchdog register themselves.

source [find target/rp2350.cfg]

adapter speed 5000

# Target names of the two cores, taken from the config just sourced: it exports
# _TARGETNAME_CM0/_TARGETNAME_CM1 and _TARGETNAME_0/_TARGETNAME_1, and those
# names have differed between OpenOCD builds, so nothing here is hard-coded.
proc f1_core_name {number} {
    foreach suffix [list "CM$number" "$number"] {
        set variable "_TARGETNAME_$suffix"
        if {[info exists ::$variable]} {
            return [set ::$variable]
        }
    }
    return [lindex [target names] $number]
}

set ::F1_CORE0 [f1_core_name 0]
set ::F1_CORE1 [f1_core_name 1]

# Target name of core 0 or 1.
proc f1_core {number} {
    if {$number == 0} {
        return $::F1_CORE0
    }
    return $::F1_CORE1
}

# 1 when the selected core is halted, 0 when it runs. DHCSR bit 17 is C_HALT.
# read_memory rather than mrw: the OpenOCD builds this repository uses do not
# always have the mrw/mrh/mrb family.
proc f1_halted {} {
    return [expr {([lindex [read_memory 0xE000EDF0 32 1] 0] & 0x20000) != 0}]
}

# Halt both cores and leave core 0 selected. A core that is already halted
# makes `halt` fail, which is not an error here; OpenOCD reads registers only
# from a target it has seen halt, so both are halted before anything is read.
proc f1_halt_cores {} {
    foreach number {0 1} {
        catch {
            targets [f1_core $number]
            halt
            wait_halt 500
        }
    }
    targets $::F1_CORE0
}

# Run both cores from wherever they are. OpenOCD resumes only a target it has
# seen halt, and resuming core 0 resumes both, so halt first and catch failures.
proc f1_resume {} {
    f1_halt_cores
    resume
}

# PC and LR of both cores, printed as "<mark> <core> <pc> <lr>", one line per
# core. The cores run again afterwards unless they were already halted.
proc f1_where {mark} {
    set was_halted [f1_halted]
    catch {
        foreach number {0 1} {
            targets [f1_core $number]
            halt
            wait_halt 500
            echo "$mark $number [reg pc] [reg lr]"
        }
    } failure
    targets $::F1_CORE0
    if {!$was_halted} {
        resume
    }
    if {$failure ne ""} {
        echo "Error: $failure"
    }
}

# "<mark> <word> <word> ..." for `count` 32-bit words at `address`, read
# without halting the core.
proc f1_read {address count mark} {
    echo "$mark [read_memory $address 32 $count]"
}

# Boot a try-before-you-buy image once, so the bootrom stages and buys it.
#
# RP2350 B3, proven on the bench: the bootrom takes its reboot vector from the
# watchdog scratch registers. With BOOT_TYPE_FLASH_UPDATE it loads the image at
# the given base, runs it, and the firmware then buys it; a plain reset instead
# skips an unbought image. LOAD=0xffffff at the standard 1 us tick gives the
# bootrom about 16.7 s before the watchdog fires, which is the window the ROM
# allows for the buy.
#
#   base  XIP address of the image, the start of the slot: 0x10002000 for A,
#         0x10782000 for B
proc f1_stage_tbyb {base} {
    targets $::F1_CORE0
    mww 0x400d8000 0            ;# watchdog control: stop it
    mww 0x40018008 0x01fffff3   ;# PSM_WDSEL: let the watchdog reset the cores
    mww 0x400d8014 $base        ;# scratch2: update base
    mww 0x400d8018 0            ;# scratch3: unused
    mww 0x400d801c 0xb007c0d3   ;# scratch4: magic
    mww 0x400d8020 0xfffffffe   ;# scratch5: flags
    mww 0x400d8024 4            ;# scratch6: BOOT_TYPE_FLASH_UPDATE
    mww 0x400d8028 0xb007c0d3   ;# scratch7: magic
    mww 0x40108030 0            ;# TIMER watchdog tick: stop it
    mww 0x40108034 12           ;# 1 us tick (clk_ref/12), as the SDK sets
    mww 0x40108030 1            ;# run that tick
    mww 0x400d8004 0xffffff     ;# watchdog load
    mww 0x400d8000 0x40000000   ;# watchdog enable: reset after the load
}
