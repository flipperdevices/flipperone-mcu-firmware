# Flipper One MCU: the SDK RP2350 target plus the board helpers the tools use.
# Pass this to `-f` instead of target/rp2350.cfg; board and core knowledge lives
# here, so the tools never name a target or a watchdog register themselves.

source [find target/rp2350.cfg]

adapter speed 5000

# Core target names come from the sourced config: OpenOCD builds differ.
proc f1_core_name {number} {
    foreach suffix [list "CM$number" "$number"] {
        set variable "_TARGETNAME_$suffix"
        if {[info exists ::$variable]} {
            return [set ::$variable]
        }
    }
    return [lindex [target names] $number]
}

set ::F1_CORE0 [f1_core_name 0]
set ::F1_CORE1 [f1_core_name 1]

# Target name of core 0 or 1.
proc f1_core {number} {
    if {$number == 0} {
        return $::F1_CORE0
    }
    return $::F1_CORE1
}

# 1 when the selected core is halted (DHCSR C_HALT). read_memory rather than
# mrw: these OpenOCD builds do not all have the mrw family.
proc f1_halted {} {
    return [expr {([lindex [read_memory 0xE000EDF0 32 1] 0] & 0x20000) != 0}]
}

# Halt both cores, leaving core 0 selected; OpenOCD only reads registers from a
# target it has seen halt, and an already halted core makes `halt` fail.
proc f1_halt_cores {} {
    foreach number {0 1} {
        catch {
            targets [f1_core $number]
            halt
            wait_halt 500
        }
    }
    targets $::F1_CORE0
}

# Resuming core 0 resumes both, but only a target that has been seen to halt.
proc f1_resume {} {
    f1_halt_cores
    resume
}

# "<mark> <core> <pc> <lr>" per core; the cores run again unless they were halted.
proc f1_where {mark} {
    set was_halted [f1_halted]
    catch {
        foreach number {0 1} {
            targets [f1_core $number]
            halt
            wait_halt 500
            echo "$mark $number [reg pc] [reg lr]"
        }
    } failure
    targets $::F1_CORE0
    if {!$was_halted} {
        resume
    }
    if {$failure ne ""} {
        echo "Error: $failure"
    }
}

# "<mark> <word> ..." for `count` words at `address`, without halting.
proc f1_read {address count mark} {
    echo "$mark [read_memory $address 32 $count]"
}

# Stage a try-before-you-buy image: the bootrom takes its reboot vector from the
# watchdog scratch, runs the image at `base` (slot start, 0x10002000 or
# 0x10782000) and the firmware buys it. LOAD=0xffffff at the 1 us tick leaves the
# ROM about 16.7 s to buy. Probed on RP2350 B3.
proc f1_stage_tbyb {base} {
    targets $::F1_CORE0
    mww 0x400d8000 0            ;# watchdog control: stop it
    mww 0x40018008 0x01fffff3   ;# PSM_WDSEL: let the watchdog reset the cores
    mww 0x400d8014 $base        ;# scratch2: update base
    mww 0x400d8018 0            ;# scratch3: unused
    mww 0x400d801c 0xb007c0d3   ;# scratch4: magic
    mww 0x400d8020 0xfffffffe   ;# scratch5: flags
    mww 0x400d8024 4            ;# scratch6: BOOT_TYPE_FLASH_UPDATE
    mww 0x400d8028 0xb007c0d3   ;# scratch7: magic
    mww 0x40108030 0            ;# TIMER watchdog tick: stop it
    mww 0x40108034 12           ;# 1 us tick (clk_ref/12), as the SDK sets
    mww 0x40108030 1            ;# run that tick
    mww 0x400d8004 0xffffff     ;# watchdog load
    mww 0x400d8000 0x40000000   ;# watchdog enable: reset after the load
}
