# Settings shared by fw and fw.cmd. One KEY=value per line, no quotes.
# Pico SDK, toolchain and picotool versions are not here: they come from CMakeLists.txt
# (sdkVersion, toolchainVersion, picotoolVersion), the same place the VS Code extension reads.

# Board built when FW_TARGET is not set
DEFAULT_FW_TARGET=f2

# Where a missing Pico SDK or ARM toolchain is fetched from
PICO_SDK_GIT_URL=https://github.com/raspberrypi/pico-sdk.git
ARM_TOOLCHAIN_BASE_URL=https://developer.arm.com/-/media/Files/downloads/gnu

# openocd configuration files used by `flash`
OPENOCD_INTERFACE=interface/cmsis-dap.cfg
OPENOCD_TARGET=target/rp2350.cfg

# Windows only: host tools fetched into %USERPROFILE%\.pico-sdk when missing. The CMake
# and Ninja versions match the paths pinned in vscode_template/settings.json.
WIN_CMAKE_VERSION=3.31.5
WIN_NINJA_VERSION=1.12.1
WIN_PYTHON_VERSION=3.13.7
CMAKE_RELEASES_URL=https://github.com/Kitware/CMake/releases/download
NINJA_RELEASES_URL=https://github.com/ninja-build/ninja/releases/download
PYTHON_RELEASES_URL=https://www.python.org/ftp/python

# Windows only: prebuilt pioasm and picotool, the archives the VS Code extension installs.
# The release tag ends in a revision that cannot be derived from the SDK version, so keep
# it in step with sdkVersion in CMakeLists.txt (github.com/raspberrypi/pico-sdk-tools/releases).
PICO_SDK_TOOLS_URL=https://github.com/raspberrypi/pico-sdk-tools/releases/download
PICO_SDK_TOOLS_RELEASE=v2.3.1-0
